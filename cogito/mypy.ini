[mypy]
python_version = 3.10
mypy_path = $MYPY_CONFIG_FILE_DIR/scripts
cache_dir = $MYPY_CONFIG_FILE_DIR/.mypy_cache
files = cogito/scripts/cogito_state_types.py,
        cogito/scripts/cogito_event_types.py,
        cogito/scripts/cogito_contracts.py,
        cogito/scripts/cogito_ports.py,
        cogito/scripts/cogito_git.py,
        cogito/scripts/cogito_projection.py,
        cogito/scripts/cogito_event_repository.py,
        cogito/scripts/cogito_run_store.py,
        cogito/scripts/cogito_run_queries.py,
        cogito/scripts/cogito_correction_rules.py,
        cogito/scripts/cogito_integration_rules.py,
        cogito/scripts/cogito_runner_evidence.py,
        cogito/scripts/cogito_gate_validation.py,
        cogito/scripts/cogito_approval.py,
        cogito/scripts/cogito_finalization.py,
        cogito/scripts/cogito_finalization_rules.py,
        cogito/scripts/cogito_delivery_summary.py,
        cogito/tests/typing/state_contract.py,
        cogito/tests/typing/event_contract.py
follow_imports = silent
check_untyped_defs = True
warn_unused_ignores = True
show_error_codes = True
